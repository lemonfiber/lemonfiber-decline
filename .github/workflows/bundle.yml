# Ask the catalogue to move this plugin's pin in the default bundle once the train's
# `release/image-pin` merges, through spec's reusable `first-party-bundle` (OPS-R86).
name: bundle
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@802aa24222531a84a0d035d3d855db271936b507 # v1.0.159
    with:
      pin: image
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
