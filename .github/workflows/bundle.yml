# Ask the catalogue to move this plugin's pin in the default bundle once the train's
# `release/image-pin` merges, through spec's reusable `first-party-bundle` (OPS-R86).
name: bundle
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@2fa1f52e13f28c27691bcc8fc7e06a882f533cbb # v1.0.177
    with:
      pin: image
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
