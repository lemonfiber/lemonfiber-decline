[package]
name = "lemonfiber-decline"
version = "0.17.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-decline"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The decline service: the one image that answers an invitation's decline address"
publish = false

[[bin]]
name = "decline"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
# The contract it speaks, the kit that serves it, and the formats of the files in its
# configuration directory, from the core at the commit the train releases this build with
# (ADR-0033).
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1584160a7a4ed4606496efcd4d1a6e7bbcf3fb1" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1584160a7a4ed4606496efcd4d1a6e7bbcf3fb1" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1584160a7a4ed4606496efcd4d1a6e7bbcf3fb1" }
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "cea9a819ca86c41be4c86161eaf670c4e6379003" }
lemonfiber-sidecar = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1584160a7a4ed4606496efcd4d1a6e7bbcf3fb1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "cea9a819ca86c41be4c86161eaf670c4e6379003", features = ["test-support"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
