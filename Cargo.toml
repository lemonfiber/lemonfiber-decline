[package]
name = "lemonfiber-decline"
version = "0.17.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-decline"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The decline service: the one image that answers an invitation's decline address"
publish = false

[[bin]]
name = "decline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
# The formats the core writes into this service's configuration directory, from the
# core at the commit the train releases this build with (ADR-0033).
lemonfiber-sidecar = { git = "https://github.com/lemonfiber/lemonfiber", rev = "3eea6a2f6bf6cbf905eddee5356b1bc649e1a116" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
