# What this repository implements, one row per requirement (OPS-R74).
#
# Each row records this repository's own share of the requirement: `done` where that
# share is built and tested here, `partial` where part of it is, `open` where none of
# it is yet. Where a requirement also binds the core or another part, their trackers
# record those shares. The release gate and the no-stubs gate read this file, and a
# `partial` or `open` row here holds the requirement open; a pull request that changes
# whether this share is met changes its row.
#
# The core writes the service's compose entry from this repository's `plugin.toml`,
# and hands it its key, its pins and the invitations over `invite.decline`. Writing the
# invitation and its addresses, and reporting a refusal as `declined` and a removal at
# the window's close as `expired`, are the core's.

